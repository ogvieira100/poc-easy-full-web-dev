server {
    listen 9090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy para a API .NET: o ingress dela é interno no Container
    # Apps (external: false), então o browser não a alcança diretamente.
    # O nginx roda dentro do mesmo ambiente e repassa /api/ para o FQDN
    # interno da API. Atenção: o ingress escuta na porta 80 (HTTP, com
    # allowInsecure: true) e encaminha para o container no targetPort 5031 —
    # a porta 5031 NÃO é exposta no edge, por isso o proxy_pass não tem porta.
    location /api/ {
        proxy_pass http://poc-easy-full-api-dev.internal.delightfulwave-fe4392e0.westus.azurecontainerapps.io;
        proxy_http_version 1.1;
        # Host deve ser o hostname do upstream ($proxy_host, default do nginx):
        # o roteamento interno entre apps do ambiente depende dele.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads de foto e nota fiscal (multipart)
        client_max_body_size 20m;

        # A API tem minReplicas 0 (scale-to-zero): a 1a chamada após inatividade
        # espera o cold start subir uma réplica antes de responder (o startup
        # probe da API permite até 240s, então os timeouts ficam folgados).
        proxy_connect_timeout 60s;
        proxy_read_timeout 180s;
    }

    # Fallback SPA: rotas do react-router são resolvidas pelo index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome (gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
