server {
    listen 9090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: rotas do react-router são resolvidas pelo index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome (gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
