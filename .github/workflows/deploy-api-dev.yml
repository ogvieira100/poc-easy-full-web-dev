name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - development

env:
  DOCKER_HUB_REPO: poc-full-filment-front

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Image Tag (Commit SHA)
      id: meta
      run: |
        # Usa os primeiros 7 caracteres do SHA do commit
        TAG="${{ github.sha }}"
        echo "IMAGE_TAG=${TAG:0:7}" >> $GITHUB_OUTPUT

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile        # Caminho do Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:${{ steps.meta.outputs.IMAGE_TAG }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Update Azure Container Apps with New Revision
      run: |
        az containerapp update \
          --name ${{ secrets.ACA_NAME }} \
          --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
          --image ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:${{ steps.meta.outputs.IMAGE_TAG }} \
          --revision-suffix ${{ steps.meta.outputs.IMAGE_TAG }}

    - name: Docker Logout
      if: always()
      run: docker logout

    - name: Azure Logout
      if: always()
      run: az logout
